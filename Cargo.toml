[package]
name = "midi-analyzer-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
midly = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
base16ct = { version = "0.2", features = ["std"] }
